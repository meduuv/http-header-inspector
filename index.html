<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTTP Header Inspector</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#08090c;color:#e8eaf0;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:32px 18px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}h1{margin:0;font-size:28px}p{color:#9298a6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}textarea{width:100%;min-height:320px;background:#0f1117;color:#dfe3ec;border:1px solid #252a35;border-radius:12px;padding:14px;font:13px/1.55 ui-monospace,monospace;resize:vertical}button{border:1px solid #303746;background:#151923;color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}button:hover{background:#1b202c}.card{background:#0d0f14;border:1px solid #202531;border-radius:14px;padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap}.stat{display:inline-flex;padding:6px 9px;border-radius:8px;background:#151923;color:#b8c0cf;font-size:12px}.headers{margin-top:12px;overflow:auto}.line{display:grid;grid-template-columns:minmax(150px,28%) 1fr;border-bottom:1px solid #1c2028;padding:9px 0;gap:12px}.key{color:#8fb7ff;font-family:ui-monospace,monospace;font-size:13px}.val{font-family:ui-monospace,monospace;font-size:13px;word-break:break-word}.warn{color:#ffc56d}.ok{color:#87e6ad}.wm{position:fixed;right:12px;bottom:8px;opacity:.035;font:10px monospace;pointer-events:none}
</style></head>
<body><div class="wrap"><div class="top"><div><h1>HTTP Header Inspector</h1><p>Paste a raw HTTP response and inspect it locally.</p></div><div class="row"><button id="demo">Load demo</button><button id="clear">Clear</button></div></div><div class="grid"><div class="card"><textarea id="raw" spellcheck="false" placeholder="HTTP/1.1 200 OK\nContent-Type: text/html\nStrict-Transport-Security: max-age=31536000\n..."></textarea></div><div class="card"><div class="row" id="stats"></div><div class="headers" id="out"><p>Nothing parsed yet.</p></div></div></div></div><div class="wm">guns.lol/meduu</div>
<script>
const raw=document.querySelector('#raw'),out=document.querySelector('#out'),stats=document.querySelector('#stats');
function inspect(){const lines=raw.value.replace(/\r/g,'').split('\n');const first=(lines.shift()||'').trim();const rows=[];for(const line of lines){if(!line.trim())continue;const i=line.indexOf(':');if(i<1)continue;rows.push([line.slice(0,i).trim(),line.slice(i+1).trim()])}const map=new Map(rows.map(([k,v])=>[k.toLowerCase(),v]));stats.innerHTML=`<span class="stat">${first||'No status line'}</span><span class="stat">${rows.length} header lines</span>`;if(!rows.length){out.innerHTML='<p>Paste a raw response header block.</p>';return}const security=['strict-transport-security','content-security-policy','x-content-type-options','x-frame-options','referrer-policy','permissions-policy'];out.innerHTML=rows.map(([k,v])=>`<div class="line"><div class="key">${esc(k)}</div><div class="val ${security.includes(k.toLowerCase())?'ok':''}">${esc(v)}</div></div>`).join('');if(map.has('set-cookie'))out.insertAdjacentHTML('afterbegin','<p class="warn">Set-Cookie detected — review cookie flags manually.</p>')}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
raw.addEventListener('input',inspect);document.querySelector('#clear').onclick=()=>{raw.value='';inspect()};document.querySelector('#demo').onclick=()=>{raw.value=`HTTP/1.1 200 OK\nContent-Type: text/html; charset=utf-8\nContent-Length: 4821\nStrict-Transport-Security: max-age=31536000; includeSubDomains\nContent-Security-Policy: default-src 'self'\nX-Content-Type-Options: nosniff\nReferrer-Policy: strict-origin-when-cross-origin\nCache-Control: public, max-age=3600`;inspect()};
</script><!-- by guns.lol/meduu --></body></html>
